name: Validate site

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install dependencies
        run: bundle install

      - name: Build site
        run: bundle exec jekyll build --strict_front_matter
        env:
          JEKYLL_ENV: production

      - name: Check that both pages list every publication
        run: |
          set -e
          for title in \
            "SynLogic: Synthesizing Verifiable Reasoning Data at Scale for Learning Logical Reasoning and Beyond" \
            "On the Perception Bottleneck of VLMs for Chart Understanding" \
            "On the Universal Truthfulness Hyperplane Inside LLMs" \
            "In-Context Sharpness as Alerts: An Inner Representation Perspective for Hallucination Mitigation" \
            "C-Eval: A Multi-Level Multi-Discipline Chinese Evaluation Suite for Foundation Models" \
            "Composing Parameter-Efficient Modules with Arithmetic Operations"; do
            grep -Fq "$title" _site/index.html
            grep -Fq "$title" _site/publications/index.html
            echo "OK: $title"
          done
          grep -Fq "jliugi@connect.ust.hk" _site/index.html
          grep -Fq "https://github.com/Vicent0205" _site/index.html
          grep -Fq "/LJT-Homepage/publications/" _site/index.html

      - name: Show rendered publications page
        run: cat _site/publications/index.html